<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Classements Smash Betting - Hall of Fame</title>
    <style>
        :root { --smash-yellow: #FFD700; --smash-orange: #FF8C00; --blb-blue: #2D3271; --bg-dark: #111; --card-bg: #222; }
        body { 
            font-family: 'Arial Black', 'Impact', sans-serif; margin: 0; padding: 20px;
            background-color: var(--bg-dark); background-image: radial-gradient(circle, #333 1px, transparent 1px);
            background-size: 30px 30px; color: white; display: flex; flex-direction: column; align-items: center; text-transform: uppercase;
        }

        h1 { font-size: 3.5em; color: var(--smash-yellow); -webkit-text-stroke: 2px black; text-shadow: 4px 4px 0px #000; letter-spacing: -2px; margin-bottom: 40px; }

        .classement-container { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; width: 95%; max-width: 1400px; }

        .classement-box { background: var(--card-bg); padding: 25px; border: 5px solid #444; box-shadow: 12px 12px 0px #000; }
        
        /* Couleurs de bordures spécifiques par bloc */
        #s2-ranking-box { border-color: var(--smash-yellow); }
        #s1-ranking-box { border-color: var(--smash-orange); }
        #bonus-ranking-box { border-color: var(--blb-blue); }
        #hof-ranking-box { border-color: #2ecc71; }

        h2 { color: white; background: linear-gradient(90deg, var(--blb-blue), transparent); padding: 10px; border-left: 8px solid var(--smash-yellow); margin-top: 0; font-size: 1.2em; text-shadow: 2px 2px 0px #000; }

        /* ⭐️ MODIFICATION : Réduction de l'espacement entre les lignes (de 8px à 4px) */
        table { width: 100%; border-collapse: separate; border-spacing: 0 4px; margin-top: 15px; }
        
        th { background-color: #000; color: var(--smash-yellow); padding: 12px; font-size: 0.9em; border-bottom: 3px solid var(--smash-yellow); }
        
        /* ⭐️ MODIFICATION : Réduction du padding interne des cellules (de 15px à 8px verticaux) */
        td { padding: 8px 15px; background: #333; border-top: 2px solid #555; border-bottom: 2px solid #000; font-size: 1.1em; }

        /* Styles de base pour les cellules */
        .user-cell { font-weight: bold; letter-spacing: 1px; color: white; }
        .score-cell { font-size: 1.3em; color: var(--smash-yellow); text-align: right !important; text-shadow: 1px 1px 2px #000; }
        
        /* Styles spécifiques aux Rangs (Podium) */
        .rank-1 td { background: linear-gradient(90deg, #FFD700, #BF953F) !important; font-size: 1.3em; border-color: white; }
        .rank-2 td { background: linear-gradient(90deg, #E6E6E6, #999) !important; border-color: white; }
        .rank-3 td { background: linear-gradient(90deg, #CD7F32, #8C5233) !important; border-color: #5d3a24; }
        .rank-3 .user-cell, .rank-3 .score-cell { color: white !important; text-shadow: 1px 1px 2px #000 !important; }

        /* ⭐️ CORRECTION CONTRASTE : Force le noir pour les Rangs 1 (Or) et 2 (Argent) ⭐️ */
        .rank-1 .user-cell, .rank-2 .user-cell,
        .rank-1 .score-cell, .rank-2 .score-cell {
            color: black !important;
            text-shadow: none !important;
            font-weight: 900;
        }

        /* ⭐️ CORRECTION EMOJIS : Ajoute une ombre noire très nette sur l'Or et l'Argent pour les étoiles/trophées ⭐️ */
        .rank-1 .blink-star, .rank-2 .blink-star,
        .rank-1 .score-cell, .rank-2 .score-cell {
            filter: drop-shadow(1px 1px 1px rgba(0,0,0,0.8)) drop-shadow(-1px -1px 0px rgba(0,0,0,0.5)); 
        }

        /* ⭐️ Étoiles Clignotantes (Victoires) */
        .hof-stars { margin-left: 10px; display: inline-block; }
        .blink-star {
            color: var(--smash-yellow); -webkit-text-stroke: 1px #000; text-shadow: 0 0 5px #FFD700;
            animation: starPulse 1.5s infinite alternate; font-size: 0.8em;
        }
        @keyframes starPulse { from { opacity: 0.4; transform: scale(0.9); } to { opacity: 1; transform: scale(1.2); } }

    </style>
</head>
<body>
    <h1>Classements Smash Betting</h1>

    <div class="classement-container">
        
        <div class="classement-box" id="s2-ranking-box">
            <h2>🏆 Classement Général - Saison 2</h2>
            <table id="classement-s2">
                <thead><tr><th>#</th><th>Utilisateur</th><th style="text-align:right">Points</th></tr></thead>
                <tbody></tbody>
            </table>
        </div>

        <div class="classement-box" id="s1-ranking-box">
            <h2>🏆 Classement Général - Saison 1</h2>
            <table id="classement-s1">
                <thead><tr><th>#</th><th>Utilisateur</th><th style="text-align:right">Points</th></tr></thead>
                <tbody></tbody>
            </table>
        </div>

        <div class="classement-box" id="bonus-ranking-box">
            <h2>✨ Nombre de bonus utilisés</h2>
            <table id="classement-bonus">
                <thead><tr><th>#</th><th>Utilisateur</th><th>Total</th><th>LU</th><th>LD</th><th>CP</th></tr></thead>
                <tbody></tbody>
            </table>
        </div>

        <div class="classement-box" id="hof-ranking-box">
            <h2>🌟 HALL OF FAME (Saisons remportées)</h2>
            <table id="classement-hof">
                <thead><tr><th>#</th><th>Utilisateur</th><th style="text-align:right">Saisons</th></tr></thead>
                <tbody></tbody>
            </table>
        </div>

    </div>

    <script>
        const apiBaseUrl = window.location.origin;

        function applyRankClass(row, rank) {
            if (rank === 1) row.className = 'rank-1';
            else if (rank === 2) row.className = 'rank-2';
            else if (rank === 3) row.className = 'rank-3';
        }

        // Génère les étoiles HTML pour le pseudo
        function getStars(wins) {
            if (!wins || wins <= 0) return '';
            let s = '<span class="hof-stars">';
            for(let i=0; i<wins; i++) s += '<span class="blink-star">⭐</span>';
            s += '</span>';
            return s;
        }

        function fetchS1() {
            fetch(`${apiBaseUrl}/api/classement/points/s1`).then(r => r.json()).then(data => {
                const body = document.getElementById('classement-s1').querySelector('tbody');
                body.innerHTML = '';
                data.forEach((item, i) => {
                    const row = body.insertRow(); applyRankClass(row, i+1);
                    row.insertCell().innerHTML = `<strong>${i+1}</strong>`;
                    row.insertCell().innerHTML = `<span class="user-cell">${item.username}</span>${getStars(item.seasonWins)}`;
                    row.insertCell().innerHTML = `<span class="score-cell">${item.totalPoints}</span>`;
                });
            });
        }

        function fetchS2() {
            fetch(`${apiBaseUrl}/api/classement/points/s2`).then(r => r.json()).then(data => {
                const body = document.getElementById('classement-s2').querySelector('tbody');
                body.innerHTML = '';
                if(data.length === 0) {
                    const row = body.insertRow();
                    const cell = row.insertCell(); cell.colSpan = 3; cell.textContent = "Aucun pari enregistré pour la Saison 2"; cell.style.textAlign = "center";
                }
                data.forEach((item, i) => {
                    const row = body.insertRow(); applyRankClass(row, i+1);
                    row.insertCell().innerHTML = `<strong>${i+1}</strong>`;
                    row.insertCell().innerHTML = `<span class="user-cell">${item.username}</span>${getStars(item.seasonWins)}`;
                    row.insertCell().innerHTML = `<span class="score-cell">${item.s2Points}</span>`;
                });
            });
        }
        
        function fetchBonus() {
            fetch(`${apiBaseUrl}/api/classement/bonus`).then(r => r.json()).then(data => {
                const body = document.getElementById('classement-bonus').querySelector('tbody');
                body.innerHTML = '';
                data.forEach((item, i) => {
                    const row = body.insertRow(); applyRankClass(row, i+1);
                    row.insertCell().textContent = i+1;
                    row.insertCell().innerHTML = `<span class="user-cell">${item.username}</span>${getStars(item.seasonWins)}`;
                    row.insertCell().textContent = item.bonusUsedCount;
                    row.insertCell().textContent = item.luCount || 0;
                    row.insertCell().textContent = item.ldCount || 0;
                    row.insertCell().textContent = item.cpCount || 0;
                });
            });
        }

        function fetchHoF() {
            fetch(`${apiBaseUrl}/api/classement/hof`).then(r => r.json()).then(data => {
                const body = document.getElementById('classement-hof').querySelector('tbody');
                body.innerHTML = '';
                if(data.length === 0) {
                    const row = body.insertRow();
                    const cell = row.insertCell(); cell.colSpan = 3; cell.textContent = "Aucun grand gagnant enregistré"; cell.style.textAlign = "center";
                }
                data.forEach((item, i) => {
                    const row = body.insertRow(); applyRankClass(row, i+1);
                    row.insertCell().innerHTML = `<strong>${i+1}</strong>`;
                    
                    // La couleur jaune n'est forcé que si ce n'est PAS rank 1 ou 2 (qui écrasent la couleur du parent)
                    row.insertCell().innerHTML = `<span class="user-cell" style="color:var(--smash-yellow)">${item.username}</span>`;
                    row.insertCell().innerHTML = `<span class="score-cell">${item.seasonWins} 🏆</span>`;
                });
            });
        }

        function refreshClassements() { fetchS1(); fetchS2(); fetchBonus(); fetchHoF(); }
        document.addEventListener('DOMContentLoaded', refreshClassements);
        setInterval(refreshClassements, 30000); 
    </script>
</body>
</html>
